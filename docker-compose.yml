version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bitacora_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-bitacora_db}
      POSTGRES_USER: ${DB_USER:-bitacora_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-enterprise_password_2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bitacora_user} -d ${DB_NAME:-bitacora_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bitacora_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitacora_backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitacora_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      - backend
      - redis
      - postgres

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitacora_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitacora_frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "80"

  proxy:
    image: nginx:1.25-alpine
    container_name: bitacora_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local
